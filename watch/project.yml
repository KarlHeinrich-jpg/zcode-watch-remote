# XcodeGen manifest.
# If you have XcodeGen (`brew install xcodegen`), this regenerates the project:
#     cd watch && xcodegen generate
# The repo also ships a checked-in ZCodeRemote.xcodeproj, so XcodeGen is optional.

name: ZCodeRemote

options:
  bundleIdPrefix: com.zcoderemote
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  ZCodeRemote:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZCodeRemote
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zcoderemote.ZCodeRemote
        PRODUCT_NAME: ZCodeRemote
        INFOPLIST_FILE: ZCodeRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: ZCodeRemote/Info.plist
      properties:
        CFBundleDisplayName: ZCode Remote

schemes:
  ZCodeRemote:
    build:
      targets:
        ZCodeRemote: all
    run:
      config: Debug
    archive:
      config: Release
